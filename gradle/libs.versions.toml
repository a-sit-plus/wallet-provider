[versions]
kotlin = "2.4.21"
spring-boot = "4.2.0-RC1"
spring-cloud = "2026.0.0-RC1"
warden-supreme = "1.2.0"
vck = "9.0.0-RC2"
signum = "3.26.0"
json = "1.12.0"
napier = "2.7.1"
webjars-locator = "1.1.5"
webjars-bootstrap = "5.3.8"

[libraries]
kotlin-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "json" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-starter-config = { module = "org.springframework.cloud:spring-cloud-starter-config" }
webjars-locator = { module = "org.webjars:webjars-locator-lite", version.ref = "webjars-locator" }
webjars-bootstrap = { module = "org.webjars:bootstrap", version.ref = "webjars-bootstrap" }
warden-supreme = { module = "at.asitplus.warden:supreme-verifier", version.ref = "warden-supreme" }
warden-config-spring = { module = "at.asitplus.warden:config-spring", version.ref = "warden-supreme" }
vck = { group = "at.asitplus.wallet", name = "vck", version.ref = "vck" }
vck-openid = { group = "at.asitplus.wallet", name = "vck-openid", version.ref = "vck" }
signum = { group = "at.asitplus.signum", name = "indispensable", version.ref = "signum" }
# Versions of H2 and PostgreSQL are managed by the Spring Boot BOM
h2 = { module = "com.h2database:h2" }
postgresql = { module = "org.postgresql:postgresql" }
napier = { module = "io.github.aakira:napier", version.ref = "napier" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSpring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
springBoot = { id = "org.springframework.boot", version.ref = "spring-boot" }
